plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maoyeye.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.maoyeye.app"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
