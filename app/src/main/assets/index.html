<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5efe2">
<title>毛选语录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <span class="brand">毛选语录</span>
    <span id="counter" class="counter"></span>
  </header>

  <main id="stage">
    <article id="card" class="card">
      <p id="quote" class="quote"></p>
      <p id="attrib" class="attrib"></p>
      <div class="rule"></div>
      <div class="bottom">
        <div id="noteWrap" class="note-wrap">
          <div class="note-label">编者注</div>
          <p id="note" class="note"></p>
        </div>
        <img id="portrait" class="portrait" src="avatar.jpg" alt="毛泽东">
      </div>
    </article>
  </main>

  <footer>
    <span id="hint" class="hint">左滑下一条 · 右滑上一条</span>
    <span class="count-label" id="countLabel"></span>
  </footer>
</div>

<script src="cards.js"></script>
<script src="deck.js"></script>
<script src="app.js"></script>
</body>
</html>
