name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maoyeye.p12"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/maoyeye.p12" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out maoyeye.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" verify --print-certs maoyeye.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maoyeye-apk
          path: maoyeye.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: maoyeye v1.3.1
          body: |
            v1.3.1

            - 修复 Android 17 / HyperOS 4.0 启动崩溃（getInsetsController 在 DecorView 创建前调用导致 NPE）
            - 状态栏避让改为在 setContentView 后应用系统栏外观，并兼容刘海/挖孔安全区
            - 热更新新增自有杭州服务器镜像（api.dognosay.dpdns.org/maoyeye/），国内网络不再依赖 GitHub
            - 同时检查 jsDelivr 与 raw.githubusercontent，取版本更高的清单，避免 CDN 缓存导致更新滞后
            - 头像换成 1950 年官方标准像（Wikimedia Commons，公有领域）
            - 编者注缩短为第一句，长文在标点处收口
            - 包内版本 v1.3.1，内容清单 v6
          files: maoyeye.apk
