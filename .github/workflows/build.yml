name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maoyeye.p12"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/maoyeye.p12" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out maoyeye.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" verify --print-certs maoyeye.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maoyeye-apk
          path: maoyeye.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: maoyeye v1.2.0
          body: |
            v1.2.0

            - 修复状态栏遮住标题：用系统栏 inset 给 WebView 容器加安全带，兼顾 HyperOS / Android 15+ 强制边到边
            - 换成标志性红底五角星头像，告别模糊翻拍裁切
            - 全面改用开源字体「得意黑」（Smiley Sans，SIL OFL 1.1）
            - 产物改为正式签名 APK：maoyeye.apk（不再是 app-debug.apk）
            - 包内版本 v1.2.0，内容清单 v5，支持应用内热更新
          files: maoyeye.apk
