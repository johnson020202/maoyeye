name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maoyeye.p12"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/maoyeye.p12" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out maoyeye.apk "$RUNNER_TEMP/maoyeye-aligned.apk"
          "$BT/apksigner" verify --print-certs maoyeye.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maoyeye-apk
          path: maoyeye.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: maoyeye v1.3.2
          body: |
            v1.3.2

            - 修复状态栏/底栏与网页背景的色差：网页背景首尾改为与原生 #F2E8D5 一致，中间保留渐变层次
            - 关闭系统给透明系统栏自动加的对比度蒙层，手势条区域不再发暗
            - 热更新走自有杭州服务器镜像（api.dognosay.dpdns.org/maoyeye/），国内网络不再依赖 GitHub
            - 保留 v1.3.1 的全部修复：Android 17 启动崩溃、状态栏避让、1950 标准像、短编者注
            - 包内版本 v1.3.2，内容清单 v7
          files: maoyeye.apk
