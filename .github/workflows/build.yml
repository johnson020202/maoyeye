name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maoyeye-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: maoyeye v1.1.0
          body: |
            v1.1.0

            - 界面重做：纸张卡片、印章标识、字号与层级调整，适配全面屏与系统栏
            - 修复左右滑动无反应：改用 touch 事件判定横向手势，跟手位移 + 松手翻页
            - 新增“上一条 / 下一条”按钮，作为手势的兜底入口
            - 应用名改为 maoyeye，新增启动图标
            - 接入热更新：启动时检查 update/version.json，有新版自动下载并切换，无需重装 APK
            - 目标 API 35，适配 Android 15+ 的全面屏强制边到边
          files: app/build/outputs/apk/debug/app-debug.apk
